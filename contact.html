    <!-- Contact form -->
    <article>

        <h2>Contact Me</h2>

        <p>You can contact me by filling out the form below.</p>

        <form action="mailto:goolaseha@gmail.com"
              method="post"
              enctype="text/plain">

            <!-- Name -->
            <p>
                <label for="name">Name:</label><br>
                <input type="text"
                       id="name"
                       name="name"
                       required>
            </p>

            <!-- Email -->
            <p>
                <label for="email">Email:</label><br>
                <input type="email"
                       id="email"
                       name="email"
                       required>
            </p>

            <!-- Cell phone number -->
            <p>
                <label for="phone">Cell No.:</label><br>
                <input type="tel"
                       id="phone"
                       name="phone"
                       pattern="[0-9]{10}"
                       title="Enter a 10-digit phone number"
                       required>
            </p>

            <!-- Message -->
            <p>
                <label for="comments">Comments:</label><br>
                <textarea id="comments"
                          name="comments"
                          rows="6"
                          cols="40"
                          required></textarea>
            </p>

            <!-- Sends the form -->
            <p>
                <input type="submit" value="Submit">
            </p>

        </form>

    </article>

    <!-- Bottom section of the page -->
    <footer>
